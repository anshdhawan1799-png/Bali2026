    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom Scrollbar for the itinerary sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Ensure map renders properly */
        #map {
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* Custom Popup styling */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .leaflet-popup-content {
            margin: 16px;
            font-family: 'Inter', sans-serif;
        }
        
        .location-card {
            transition: all 0.2s ease-in-out;
        }
        .location-card:hover {
            transform: translateX(4px);
            border-color: #3b82f6;
        }
    </style>
</head>

            </div>
            
            <!-- Itinerary Container (populated by JS) -->

        <!-- Right Area: Map -->

                    }
                ]

            {
                dayNumber: 8,
                title: "Return Journey",
                date: "Sat & Sun, Aug 22-23, 2026",
                locations: [
                    { 
                        id: "loc8_1", 
                        name: "Ngurah Rai Airport (DPS)", 
                        lat: -8.7481, lng: 115.1675, 
                        type: "airport",
                        time: "Aug 22, 14:35 - 19:40",
                        desc: "Flight from Denpasar to Delhi. <br><a href='https://drive.google.com/file/d/19H9-LBeXFGMDi4eGBHKY6oXoPMl30-9V/view?usp=drive_link' target='_blank' onclick='event.stopPropagation()' class='text-blue-600 font-medium hover:underline mt-1 inline-block'>Flight Tickets - Bali</a>" 
                    },
                    {
                        id: "loc8_2",
                        name: "Delhi Airport (DEL)",
                        lat: 28.5562, lng: 77.1000,
                        type: "airport",
                        time: "Aug 23, 00:15 - 01:50",
                        desc: "Flight from Delhi to Ahmedabad. <br><a href='https://drive.google.com/file/d/1w0HYl7kEcKCTECB-E4TfKA3ua0YPsl0-/view?usp=drive_link' target='_blank' onclick='event.stopPropagation()' class='text-blue-600 font-medium hover:underline mt-1 inline-block'>Flight Tickets - DelAhm</a>"
                    }
                ]

        ];

        // Map icon configuration based on location type
        const typeConfig = {
            airport: { icon: 'fa-plane', color: 'bg-indigo-500', markerColor: '#6366f1' },
            food: { icon: 'fa-utensils', color: 'bg-orange-500', markerColor: '#f97316' },
            beach: { icon: 'fa-umbrella-beach', color: 'bg-cyan-500', markerColor: '#06b6d4' },
            landmark: { icon: 'fa-monument', color: 'bg-amber-600', markerColor: '#d97706' },
            nature: { icon: 'fa-leaf', color: 'bg-emerald-500', markerColor: '#10b981' },
            shopping: { icon: 'fa-bag-shopping', color: 'bg-pink-500', markerColor: '#ec4899' },
            activity: { icon: 'fa-person-hiking', color: 'bg-red-500', markerColor: '#ef4444' },
            relax: { icon: 'fa-spa', color: 'bg-teal-500', markerColor: '#14b8a6' },
            default: { icon: 'fa-location-dot', color: 'bg-blue-500', markerColor: '#3b82f6' }
        };

        // Create custom Leaflet icon generator
        const createCustomIcon = (type) => {
            const config = typeConfig[type] || typeConfig.default;
            return L.divIcon({
                className: 'custom-div-icon',
                html: `
                    <div style="
                        background-color: ${config.markerColor};
                        width: 30px; 
                        height: 30px; 
                        border-radius: 50% 50% 50% 0;
                        transform: rotate(-45deg);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border: 2px solid white;
                        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                    ">
                        <i class="fa-solid ${config.icon}" style="color: white; transform: rotate(45deg); font-size: 12px;"></i>
                    </div>
                `,
                iconSize: [30, 30],
                iconAnchor: [15, 30],
                popupAnchor: [0, -30]
            });
        };

        // Initialize Map centered roughly on Bali
        const map = L.map('map', {
            zoomControl: false // Move to bottom right
        }).setView([-8.4095, 115.1889], 10);
        
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Add sleek CartoDB Positron basemap for a modern look
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Store markers globally to interact with them from the sidebar
        const markers = {};

        // Function to render the itinerary and add map markers
        function renderItinerary() {
            const container = document.getElementById('itinerary-container');
            const bounds = L.latLngBounds();

            itineraryData.forEach((day, dayIndex) => {
                // Create Day Header
                const daySection = document.createElement('div');
                daySection.className = 'relative';
                
                // Connecting line for timeline
                if (dayIndex !== itineraryData.length - 1) {
                    const line = document.createElement('div');
                    line.className = 'absolute top-10 bottom-[-24px] left-3.5 w-0.5 bg-slate-200 z-0';
                    daySection.appendChild(line);
                }

                const dayHeader = document.createElement('div');
                dayHeader.className = 'flex items-center gap-3 mb-4 relative z-10';
                dayHeader.innerHTML = `
                    <div class="h-7 w-7 rounded-full bg-slate-800 text-white flex items-center justify-center text-sm font-bold shadow ring-4 ring-white">
                        ${day.dayNumber}
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 leading-none">${day.title}</h3>
                        <span class="text-xs text-slate-500">${day.date}</span>
                    </div>
                `;
                daySection.appendChild(dayHeader);

                // Create Locations for the Day
                const locationList = document.createElement('div');
                locationList.className = 'pl-10 space-y-3';

                day.locations.forEach((loc) => {
                    const config = typeConfig[loc.type] || typeConfig.default;
                    
                    // 1. Add Marker to Map
                    const marker = L.marker([loc.lat, loc.lng], { icon: createCustomIcon(loc.type) }).addTo(map);
                    
                    // Add Popup
                    const popupContent = `
                        <div class="p-1 min-w-[200px]">
                            <div class="flex items-center gap-2 mb-2">
                                <div class="${config.color} text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">
                                    <i class="fa-solid ${config.icon}"></i>
                                </div>
                                <h4 class="font-bold text-slate-800 text-sm m-0">${loc.name}</h4>
                            </div>
                            <p class="text-xs text-slate-600 mb-2 leading-relaxed">${loc.desc}</p>
                            <span class="inline-block bg-slate-100 text-slate-600 text-[10px] px-2 py-1 rounded font-medium border border-slate-200">
                                <i class="fa-regular fa-clock mr-1"></i> ${loc.time}
                            </span>
                        </div>
                    `;
                    marker.bindPopup(popupContent);
                    markers[loc.id] = marker;
                    bounds.extend([loc.lat, loc.lng]);

                    // 2. Add Location Card to Sidebar
                    const card = document.createElement('div');
                    card.className = 'location-card bg-white border border-slate-200 rounded-xl p-3 cursor-pointer shadow-sm hover:shadow-md relative overflow-hidden';
                    
                    // Left color accent bar
                    card.innerHTML = `
                        <div class="absolute left-0 top-0 bottom-0 w-1 ${config.color}"></div>
                        <div class="flex justify-between items-start mb-1">
                            <h4 class="font-semibold text-sm text-slate-800 pr-4">${loc.name}</h4>
                            <span class="text-[10px] font-semibold text-slate-500 whitespace-nowrap bg-slate-100 px-1.5 py-0.5 rounded">${loc.time}</span>
                        </div>
                        <p class="text-xs text-slate-500">${loc.desc}</p>
                    `;

                    // Add Click Event to pan to marker
                    card.addEventListener('click', () => {
                        // Highlight active card
                        document.querySelectorAll('.location-card').forEach(c => {
                            c.classList.remove('border-blue-500', 'ring-1', 'ring-blue-500', 'bg-blue-50/30');
                            c.classList.add('border-slate-200');
                        });
                        card.classList.remove('border-slate-200');
                        card.classList.add('border-blue-500', 'ring-1', 'ring-blue-500', 'bg-blue-50/30');

                        // Fly map and open popup
                        map.flyTo([loc.lat, loc.lng], 15, {
                            duration: 1.5,
                            easeLinearity: 0.25
                        });
                        
                        // Wait for flyTo to finish before opening popup
                        setTimeout(() => {
                            marker.openPopup();
                        }, 1500);
                        
                        // On mobile, automatically scroll down slightly to show map if needed
                        if (window.innerWidth < 768) {
                            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                        }
                    });

                    locationList.appendChild(card);
                });

                daySection.appendChild(locationList);
                container.appendChild(daySection);
            });

            // Adjust map view to fit all markers
            if (itineraryData.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        // Execute render
        window.addEventListener('DOMContentLoaded', renderItinerary);

    </script>
</body>
</html>
